services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careroute
      POSTGRES_USER: careroute
      POSTGRES_PASSWORD: careroute
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careroute"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Published on a non-default host port so PostgreSQL integration tests can run
    # from the host venv. SQLite cannot express SELECT ... FOR UPDATE, so row-lock
    # behavior is untestable without a real PostgreSQL connection. Local demo only.
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # The provider domain owns its storage: separate instance, separate volume,
  # separate health check, separate migration lineage.
  provider-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careroute_provider
      POSTGRES_USER: careroute
      POSTGRES_PASSWORD: careroute
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careroute -d careroute_provider"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55433:5432"
    volumes:
      - provider_postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://careroute:careroute@db:5432/careroute
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deterministic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-90}
      PROVIDER_SERVICE_URL: http://provider-service:8010
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-3}
      PROVIDER_RETRY_ATTEMPTS: ${PROVIDER_RETRY_ATTEMPTS:-3}
      PROVIDER_RETRY_BACKOFF_SECONDS: ${PROVIDER_RETRY_BACKOFF_SECONDS:-0.1}
      PROVIDER_INTERNAL_TOKEN: ${PROVIDER_INTERNAL_TOKEN:-careroute-local-synthetic}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: ${OTEL_METRIC_EXPORT_INTERVAL_SECONDS:-15}
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      provider-service:
        condition: service_healthy
  provider-service:
    build: ./backend
    command: sh -c "alembic -c alembic_provider.ini upgrade head && uvicorn app.provider_service:app --host 0.0.0.0 --port 8010"
    environment:
      PROVIDER_DATABASE_URL: postgresql+psycopg://careroute:careroute@provider-db:5432/careroute_provider
      PROVIDER_INTERNAL_TOKEN: ${PROVIDER_INTERNAL_TOKEN:-careroute-local-synthetic}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-2}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: ${OTEL_METRIC_EXPORT_INTERVAL_SECONDS:-15}
    ports: ["8010:8010"]
    depends_on:
      provider-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://api:8000/api/inngest
    ports:
      - "8288:8288"
      - "8289:8289"
    depends_on:
      - api
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "13133:13133"
    depends_on:
      - tempo
  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Viewer lacks datasources:explore in Grafana 13; Explore is the only
      # human path to a trace because Tempo is intentionally unpublished.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
    ports:
      - "3002:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["${CAREROUTE_WEB_PORT:-3001}:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  provider_postgres_data:
  tempo_data:
  grafana_data:
  prometheus_data:
