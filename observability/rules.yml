groups:
  - name: careroute-safety
    interval: 30s
    rules:
      # The deterministic layer rejecting model proposals is correct behavior.
      # A sustained rise in that rate is not: it means the model is drifting
      # away from what policy will accept.
      - alert: CareRouteFailClosedRateHigh
        expr: |
          sum(rate(careroute_policy_validations_total{outcome="rejected"}[10m]))
            /
          clamp_min(sum(rate(careroute_policy_validations_total[10m])), 0.001)
            > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deterministic policy is rejecting over 20% of model proposals"

      # Effectively-once booking is a core guarantee. Any duplicate at all is
      # a correctness signal, not a capacity one.
      - alert: CareRouteDuplicateBooking
        expr: increase(careroute_booking_attempts_total{result="duplicate_suppressed"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Idempotent booking suppressed a duplicate; investigate the caller"

  - name: careroute-distribution
    interval: 30s
    rules:
      - alert: CareRouteProviderGatewayErrors
        expr: |
          sum(rate(careroute_provider_requests_total{outcome!="success"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider gateway is returning non-success outcomes"

      - alert: CareRouteProviderRetryExhaustion
        expr: increase(careroute_provider_retry_exhausted_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Provider gateway exhausted its bounded retries"

      - alert: CareRouteModelLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(careroute_model_latency_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model p95 latency above 30s"

      - alert: CareRouteWorkflowsNeedingReview
        expr: |
          increase(careroute_workflow_runs_total{terminal_state="NEEDS_HUMAN_REVIEW"}[30m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Workflows are escalating to human review at an elevated rate"

  - name: careroute-delivery
    interval: 30s
    rules:
      # Age, not depth. A large backlog draining steadily is healthy; a single
      # row stuck for minutes means the relay is not running at all.
      - alert: CareRouteOutboxNotDraining
        expr: |
          max(careroute_outbox_age_seconds_sum / clamp_min(careroute_outbox_age_seconds_count, 1)) by (domain) > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox events in {{ $labels.domain }} are older than 2 minutes; the relay is likely down"

      # Depth is still worth watching, but only when it grows without draining.
      - alert: CareRouteOutboxBacklogGrowing
        expr: |
          min_over_time(
            (max(careroute_outbox_depth_sum / clamp_min(careroute_outbox_depth_count, 1)) by (domain))[15m:]
          ) > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog in {{ $labels.domain }} has stayed above 50 for 15m"

      - alert: CareRouteRelayCannotReachBroker
        expr: increase(careroute_relay_dispatched_total{outcome="broker_unavailable"}[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Relay cannot reach Redis; events are accumulating undispatched"

      # Consumer lag: events are being published but nothing is handling them.
      # Compared as rates so a quiet system does not alert.
      - alert: CareRouteConsumerLag
        expr: |
          sum(rate(careroute_relay_dispatched_total{outcome="dispatched"}[10m]))
            - sum(rate(careroute_events_consumed_total[10m])) > 1
        for: 10m
        labels:
          severity: warning
          
        annotations:
          summary: "Events are being published faster than they are consumed"

      - alert: CareRouteConsumerStalled
        expr: |
          sum(rate(careroute_relay_dispatched_total{outcome="dispatched"}[10m])) > 0
            and sum(rate(careroute_events_consumed_total[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Events are being published and nothing is consuming them"

      # The reconciler repairing anything means an event was lost. Occasional is
      # the design working; sustained means delivery is broken underneath it.
      - alert: CareRouteReconcilerRepairingSteadily
        expr: increase(careroute_reconciliations_total{outcome="reconciled"}[30m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Reconciler is repairing bookings regularly; domain events are being lost"
